<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e63946" />
    <title>Robotics Stocks</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23e63946'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' font-family='system-ui' font-size='34' font-weight='700' fill='white'%3ER%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <h1 class="topbar__title">
          <span class="topbar__mark">R</span>
          Robotics Stocks
        </h1>
        <div class="topbar__meta">
          <span id="meta-updated">—</span>
        </div>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-tab="inventory" role="tab" aria-selected="true">
          在庫
          <span class="tab__count" id="count-inventory">0</span>
        </button>
        <button class="tab" data-tab="shopping" role="tab" aria-selected="false">
          買い物
          <span class="tab__count" id="count-shopping">0</span>
        </button>
      </nav>
    </header>

    <main class="content">
      <!-- INVENTORY TAB -->
      <section id="tab-inventory" class="panel is-active" role="tabpanel">
        <div class="panel__controls">
          <div class="search">
            <input id="search" type="search" placeholder="名前・型番・POSコードで検索" />
          </div>
          <div class="filters" id="filters" aria-label="カテゴリ"></div>
        </div>

        <div class="summary" id="summary"></div>

        <ul class="cards" id="inventory-list" aria-live="polite"></ul>
        <p class="empty" id="inventory-empty" hidden>該当するパーツが見つかりません。</p>
      </section>

      <!-- SHOPPING TAB -->
      <section id="tab-shopping" class="panel" role="tabpanel" hidden>
        <div class="panel__controls panel__controls--right">
          <div class="project-switch" id="project-switch"></div>
          <button class="ghost-btn" id="reset-todo" type="button" title="チェックを全部リセット">リセット</button>
        </div>
        <div class="shopping" id="shopping"></div>
      </section>
    </main>

    <footer class="foot">
      <span>© <span id="year"></span> Issei · </span>
      <a href="https://github.com/isseiM0312/robotics-stocks" target="_blank" rel="noreferrer">GitHub</a>
    </footer>

    <script src="./app.js" defer></script>
  </body>
</html>
